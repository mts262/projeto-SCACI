<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1c1b" />
    <title>Clientes | S.C.A.C.I.</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="brand" aria-label="S.C.A.C.I.">
      <span>S.C.A.</span><span>C.I.</span>
    </header>

    <aside class="sidebar" aria-label="Menu principal">
      <p class="menu-title">Menu</p>
      <nav>
        <button type="button" data-section="Início">Início</button>
        <button type="button" aria-current="page" data-section="Clientes">Clientes</button>
        <button type="button" data-section="Compradores">Compradores</button>
        <button type="button" data-section="Imóveis">Imóveis</button>
        <button type="button" data-section="Vendas">Vendas</button>
        <button type="button" data-section="Agenda de Visita">Agenda de Visita</button>
        <button type="button" data-section="Funcionários">Funcionários</button>
        <button type="button" data-section="Corretores">Corretores</button>
      </nav>
    </aside>

    <main id="conteudo" tabindex="-1">
      <nav class="breadcrumb" aria-label="Localização">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9.5Z" />
        </svg>
        <span class="chevron" aria-hidden="true">‹</span>
        <ol>
          <li>Início</li>
          <li>Clientes</li>
          <li aria-current="page">Tela inicial</li>
        </ol>
      </nav>

      <section class="content" aria-labelledby="page-title">
        <div class="welcome-block">
          <p class="eyebrow">Início</p>
          <h1 id="page-title">Olá, <span>Kleber Vieira</span></h1>
        </div>

        <section class="panel actions-panel" aria-labelledby="actions-title">
          <div class="panel-header">
            <h2 id="actions-title">Ações</h2>
          </div>

          <div class="action-grid">
            <button type="button" class="action-card" data-action="editar-venda">
              <span class="card-icon">✎</span>
              <div>
                <h3>Editar venda</h3>
              </div>
            </button>

            <button type="button" class="action-card" data-action="nova-venda">
              <span class="card-icon">＋</span>
              <div>
                <h3>Nova venda</h3>
              </div>
            </button>
          </div>
        </section>

        <section class="sales-panel" aria-labelledby="sales-title">
          <h2 id="sales-title">Confira suas vendas:</h2>

          <div class="sales-list">
            <button type="button" class="sale-item" data-action="andamento">
              <span class="sale-dot dot-1"></span>
              <span>Vendas em andamento</span>
            </button>

            <button type="button" class="sale-item" data-action="abertas">
              <span class="sale-dot dot-2"></span>
              <span>Vendas abertas</span>
            </button>

            <button type="button" class="sale-item" data-action="concluidas">
              <span class="sale-dot dot-3"></span>
              <span>Vendas concluídas</span>
            </button>
          </div>
        </section>
      </section>
    </main>

    <dialog id="navigation-dialog" aria-labelledby="dialog-title">
      <h2 id="dialog-title">Módulo em desenvolvimento</h2>
      <p id="navigation-message">Essa funcionalidade ainda não está disponível nesta versão.</p>
      <form method="dialog">
        <button class="primary-button" type="submit">Voltar</button>
      </form>
    </dialog>
  </body>
</html>
