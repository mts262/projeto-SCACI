<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1c1b">
  <title>Excluir Imóvel | S.C.A.C.I.</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../../shared/styles.css">
</head>
<body>
  <header class="brand" aria-label="S.C.A.C.I."><span>S.C.A.</span><span>C.I.</span></header>

  <aside class="sidebar">
    <div class="menu-title">Menu</div>
    <nav>
      <button type="button" data-section="Início">Início</button>
      <button type="button" data-section="Clientes">Clientes</button>
      <button type="button" data-section="Compradores">Compradores</button>
      <button type="button" data-section="Imóveis" class="active" aria-current="page">Imóveis</button>
      <button type="button" data-section="Vendas">Vendas</button>
      <button type="button" data-section="Agenda de Visita">Agenda de Visita</button>
      <button type="button" data-section="Funcionários">Funcionários</button>
      <button type="button" data-section="Corretores">Corretores</button>
    </nav>
  </aside>

  <main>
    <div class="breadcrumb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <ol>
        <li>Início</li>
        <li>Excluir Imóvel</li>
      </ol>
    </div>

    <section class="content" aria-labelledby="page-title">
      <h1 id="page-title">Excluir <span>Imóvel</span></h1>

      <div class="form-body">

        <!-- Proprietário -->
        <div class="field">
          <label for="owner">Proprietário</label>
          <input id="owner" type="text" readonly>
        </div>

        <div class="field">
          <label for="saleDeadline">Prazo de Venda</label>
          <input id="saleDeadline" type="text" readonly>
        </div>

        <div class="field">
          <label for="ownerNotes">Observação do Proprietário</label>
          <input id="ownerNotes" type="text" readonly>
        </div>

        <!-- Imóvel -->
        <div class="field">
          <label for="propertyType">Tipo de Imóvel</label>
          <input id="propertyType" type="text" readonly>
        </div>

        <!-- Terreno (oculto por padrão) -->
        <div id="terreno-fields" hidden>
          <div class="field">
            <label for="zona">Zona do Terreno</label>
            <input id="zona" type="text" readonly>
          </div>

          <div class="field">
            <label for="tipoTerreno">Tipo de Terreno</label>
            <input id="tipoTerreno" type="text" readonly>
          </div>
        </div>

        <!-- Casa / Apartamento (oculto por padrão) -->
        <div id="casa-ape-fields" hidden>
          <div class="field">
            <label for="valorIptuAnual">Valor Anual do IPTU</label>
            <input id="valorIptuAnual" type="text" readonly>
          </div>

          <div class="field">
            <label for="dataUltimoIptu">Data do Último IPTU</label>
            <input id="dataUltimoIptu" type="text" readonly>
          </div>

          <div class="field">
            <label for="valorCondominio">Valor do Condomínio</label>
            <input id="valorCondominio" type="text" readonly>
          </div>
        </div>

        <div class="field">
          <label for="registrationNumber">Matrícula do Imóvel</label>
          <input id="registrationNumber" type="text" readonly>
        </div>

        <div class="field">
          <label for="iptuNumber">Inscrição do IPTU</label>
          <input id="iptuNumber" type="text" readonly>
        </div>

        <div class="field">
          <label for="legalStatus">Situação Legal</label>
          <input id="legalStatus" type="text" readonly>
        </div>

        <div class="field">
          <label for="propertyDescription">Descrição do Imóvel</label>
          <input id="propertyDescription" type="text" readonly>
        </div>

        <div class="field">
          <label for="totalArea">Área Total</label>
          <input id="totalArea" type="text" readonly>
        </div>

        <div class="field">
          <label for="availabilityDate">Data de Disponibilidade</label>
          <input id="availabilityDate" type="text" readonly>
        </div>

        <!-- Valores -->
        <div class="field">
          <label for="saleValue">Valor de Venda</label>
          <input id="saleValue" type="text" readonly>
        </div>

        <div class="field">
          <label for="minSaleValue">Valor Mínimo de Venda</label>
          <input id="minSaleValue" type="text" readonly>
        </div>

        <div class="field">
          <label for="appraisalValue">Cotação do Imóvel</label>
          <input id="appraisalValue" type="text" readonly>
        </div>

        <div class="field">
          <label for="notes">Observação do Imóvel</label>
          <input id="notes" type="text" readonly>
        </div>

        <!-- Endereço -->
        <div class="cep-row">
          <div class="field">
            <label for="postalCode">CEP</label>
            <input id="postalCode" type="text" readonly>
          </div>
          <div class="field">
            <label for="complement">Complemento</label>
            <input id="complement" type="text" readonly>
          </div>
        </div>

        <div class="field">
          <label for="street">Logradouro</label>
          <input id="street" type="text" readonly>
        </div>

        <div class="address-row">
          <div class="field">
            <label for="number">Nº</label>
            <input id="number" type="text" readonly>
          </div>
          <div class="field">
            <label for="neighborhood">Bairro</label>
            <input id="neighborhood" type="text" readonly>
          </div>
        </div>

        <div class="city-row">
          <div class="field">
            <label for="city">Cidade</label>
            <input id="city" type="text" readonly>
          </div>
          <div class="field">
            <label for="state">UF</label>
            <input id="state" type="text" readonly>
          </div>
        </div>

        <!-- Documentos -->
        <div class="field">
          <span class="field-label" id="possession-label">Comprovante de Posse</span>
          <a id="possessionLink" class="proof-link" href="#" target="_blank" rel="noopener" aria-labelledby="possession-label" hidden>Abrir comprovante</a>
          <input id="possessionEmpty" type="text" value="Nenhum comprovante" aria-labelledby="possession-label" readonly>
        </div>

        <div class="field">
          <span class="field-label" id="registry-label">Certidão de Matrícula</span>
          <a id="registryLink" class="proof-link" href="#" target="_blank" rel="noopener" aria-labelledby="registry-label" hidden>Abrir certidão</a>
          <input id="registryEmpty" type="text" value="Nenhuma certidão" aria-labelledby="registry-label" readonly>
        </div>
      </div>

      <div class="save-area">
        <p id="save-status" role="status" aria-live="polite"></p>
        <button id="btn-excluir" class="delete-button" type="button">Excluir Imóvel</button>
      </div>
    </section>
  </main>

  <dialog id="modal-exclusao" aria-labelledby="modal-title" aria-describedby="modal-text">
    <span class="modal-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </span>
    <h2 id="modal-title">Tem certeza que deseja excluir este imóvel?</h2>
    <p id="modal-text">Esta ação não poderá ser desfeita.</p>
    <div class="modal-actions">
      <button id="btn-nao" class="btn-nao" type="button">Não</button>
      <button id="btn-confirmar" class="btn-confirmar" type="button">Sim, excluir</button>
    </div>
  </dialog>

  <dialog id="modal-sucesso" aria-labelledby="sucesso-title" aria-describedby="sucesso-text">
    <span class="modal-icon sucesso" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12.5 2.5 2.5L16 9.5"/></svg>
    </span>
    <h2 id="sucesso-title">Imóvel excluído com sucesso!</h2>
    <p id="sucesso-text">O imóvel foi removido do sistema.</p>
    <div class="modal-actions">
      <button id="btn-ok" class="btn-ok" type="button">Fechar</button>
    </div>
  </dialog>

  <dialog id="navigation-dialog">
    <p id="navigation-message"></p>
    <form method="dialog">
      <button>OK</button>
    </form>
  </dialog>

  <script src="../../shared/nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
