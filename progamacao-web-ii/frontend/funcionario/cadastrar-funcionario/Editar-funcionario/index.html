<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1c1c1b">
    <title>Editar Funcionario | S.C.A.C.I.</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../../shared/styles.css">
</head>
<body>
    <header class="brand" aria-label="S.C.A.C.I."><span>S.C.A.</span><span>C.I.</span></header>

    <aside class="sidebar">
    <div class="menu-title">Menu</div>
    <nav>
      <button type="button" data-section="Início">Início</button>
      <button type="button" data-section="Clientes">Clientes</button>
      <button type="button" data-section="Compradores">Compradores</button>
      <button type="button" data-section="Imóveis">Imóveis</button>
      <button type="button" data-section="Vendas">Vendas</button>
      <button type="button" data-section="Agenda de Visita">Agenda de Visita</button>
      <button type="button" data-section="Funcionários" class="active" aria-current="page">Funcionários</button>
      <button type="button" data-section="Corretores">Corretores</button>
    </nav>
  </aside>

  <main id="conteudo" tabindex="-1">
    <nav class="breadcrumb" aria-label="Localização">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></svg>
        <ol>
            <li>Início</li>
            <li>Funcionario</li>
            <li aria-current="page">Editar</li>
        </ol>
    </nav>
    <section class="contet" aria-labelledby="page-title">
        <h1 id="page-title">Editar<span>Funcionario</span></h1>

        <form id="funcionario-form">
            <div class="personal-field">
                <div class="field">
                    <label for="name">Nome</label>
                    <input id="name" name="name" autocomplete="name" required maxlength="100">
                </div>

                <div class="field">
                    <label for="cpf">CPF</label>
                    <input id="cpf" name="cpf" inputmode="numeric" required maxlength="11" aria-describedby="cpf-error">
                    <span class="error" id="cpf-error"></span> 
                </div>

                <div class="field">
                    <label for="salario">Salario Base</label>
                    <input type="number" id="salario" name="salario" step="0.01" min="0" max="99999.99" placeholder="0,00" required>
                </div>

                <div class="field">
                    <label for="funcao">Função</label>
                    <input type="text" id="funcao" name="funcao" maxlength="100" placeholder="Ex: Assistente administrativo, Serviços gerais...">
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="tel-national" required maxlength="100">
                </div>

                <div class="field">
                    <label for="phone">Telefone</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel-national" required maxlength="16">
                </div>

                <div class="field">
                    <p id="save-status"role="status" aria-live="polite"></p>
                    <button class="save-button" type="submit">Salvar edição</button>
                </div>
            </div>
        </form>
    </section>
  </main>
  
  <dialog id="navigation-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title">Módulo em desenvolvimento</h2>
    <p id="navigation-message"></p>
    <form method="dialog">
      <button class="save-button">Voltar à edição</button>
    </form>
  </dialog>
</body>
</html>
