<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1c1b">
  <title>Excluir Funcionário | S.C.A.C.I.</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../../shared/styles.css">
  <script src="../../shared/nav.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="brand" aria-label="S.C.A.C.I."><span>S.C.A.</span><span>C.I.</span></header>

  <aside class="sidebar">
    <div class="menu-title">Menu</div>
    <nav>
      <button type="button" data-section="Início">Início</button>
      <button type="button" data-section="Clientes">Clientes</button>
      <button type="button" data-section="Compradores">Compradores</button>
      <button type="button" data-section="Imóveis">Imóveis</button>
      <button type="button" data-section="Vendas">Vendas</button>
      <button type="button" data-section="Agenda de Visita">Agenda de Visita</button>
      <button type="button" data-section="Funcionários" class="active" aria-current="page">Funcionários</button>
      <button type="button" data-section="Corretores">Corretores</button>
    </nav>
  </aside>

  <main>
    <div class="breadcrumb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <ol>
        <li>Início</li>
        <li>Excluir Funcionário</li>
      </ol>
    </div>

    <section class="content" aria-labelledby="page-title">
      <h1 id="page-title">Excluir <span>Funcionário</span></h1>

        <div class="form-body">
          <div class="field">
            <label for="name">Nome Completo</label>
            <input id="name" type="text" readonly>
          </div>

          <div class="field">
            <label for="document">CPF</label>
            <input id="document" type="text" readonly>
          </div>

          <div class="field">
            <label for="salary">Salário Base</label>
            <input id="salary" type="text" readonly>
          </div>

          <div class="field">
            <label for="jobTitle">Função Exercida</label>
            <input id="jobTitle" type="text" readonly>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="text" readonly>
          </div>

          <div class="field">
            <label for="phone">Telefone</label>
            <input id="phone" type="text" readonly>
          </div>
        </div>
        
        <div class="save-area">
            <p id="save-status" role="status" aria-live="polite"></p>
            <button id="btn-excluir" class="delete-button" type="button">Excluir Funcionário</button>
        </div>
    </section>
  </main>

  <dialog id="modal-exclusao" aria-labelledby="modal-title" aria-describedby="modal-text">
    <span class="modal-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </span>
    <h2 id="modal-title">Tem certeza que deseja excluir este funcionário?</h2>
    <p id="modal-text">Esta ação não poderá ser desfeita.</p>
    <div class="modal-actions">
      <button id="btn-nao" class="btn-nao" type="button">Não</button>
      <button id="btn-confirmar" class="btn-confirmar" type="button">Sim, excluir</button>
    </div>
  </dialog>

  <dialog id="modal-sucesso" aria-labelledby="sucesso-title" aria-describedby="sucesso-text">
    <span class="modal-icon sucesso" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12.5 2.5 2.5L16 9.5"/></svg>
    </span>
    <h2 id="sucesso-title">Funcionário excluído com sucesso!</h2>
    <p id="sucesso-text">O funcionário foi removido do sistema.</p>
    <div class="modal-actions">
      <button id="btn-ok" class="btn-ok" type="button">Fechar</button>
    </div>
  </dialog>

  <dialog id="navigation-dialog">
    <p id="navigation-message"></p>
    <form method="dialog">
      <button>OK</button>
    </form>
  </dialog>
</body>
</html>
