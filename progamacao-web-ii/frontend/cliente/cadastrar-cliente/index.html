<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Cliente - S.C.A.C.I.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="brand">
    <span>S.C.A.C.I.</span>
  </header>

  <aside class="sidebar">
    <div class="menu-title">MENU</div>
    <nav>
      <button type="button">Compradores</button>
      <button type="button">Imóveis</button>
      <button type="button">Vendas</button>
      <button type="button">Agenda de Visita</button>
      <button type="button">Funcionários</button>
      <button type="button">Corretores</button>
    </nav>
  </aside>

  <main>
    <div class="breadcrumb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <ol>
        <li>Início</li>
        <li>Cadastrar Cliente</li>
      </ol>
    </div>

    <div class="content">
      <h1>Cadastrar <span>Cliente</span></h1>

      <form id="client-form" novalidate>
        <div class="form-body">
          <div class="field">
            <input id="name" name="name" placeholder="Nome Completo" autocomplete="name" required maxlength="100">
          </div>

          <div class="field">
            <input id="document" name="document" placeholder="CPF ou CNPJ" inputmode="numeric" required maxlength="18" aria-describedby="document-error">
            <span class="error" id="document-error"></span>
          </div>

          <div class="field date-field">
            <span class="calendar-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </span>
            <input type="text" id="birthDate" name="birthDate" placeholder="Data de Nascimento (DD/MM/AAAA)" required onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'">
          </div>

          <div class="field">
            <input type="tel" id="phone" name="phone" placeholder="Telefone" autocomplete="tel-national" required maxlength="16">
          </div>

          <div class="field">
            <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" maxlength="100">
          </div>
          
          <div class="cep-row">
            <div class="field">
              <input id="postalCode" name="postalCode" placeholder="CEP" autocomplete="postal-code" inputmode="numeric" required maxlength="9" aria-describedby="postal-error">
              <span class="error" id="postal-error"></span>
            </div>
            <div class="field">
              <input id="complement" name="complement" placeholder="Complemento" maxlength="100">
            </div>
          </div>
          
          <div class="field">
            <input id="street" name="street" placeholder="Logradouro" autocomplete="address-line1" required maxlength="100">
          </div>
          
          <div class="address-row">
            <div class="field">
              <input id="number" name="number" placeholder="Nº" required maxlength="10">
            </div>
            <div class="field">
              <input id="neighborhood" name="neighborhood" placeholder="Bairro" required maxlength="100">
            </div>
          </div>
          
          <div class="city-row">
            <div class="field">
              <input id="city" name="city" placeholder="Cidade" autocomplete="address-level2" required maxlength="100">
            </div>
            <div class="field">
              <select id="state" name="state" autocomplete="address-level1" required aria-label="UF">
                <option value="" disabled selected hidden>UF</option>
              </select>
            </div>
          </div>

          <div class="field">
            <div class="upload" id="drop-zone">
              <span id="file-name">Comprovante de Residência, clique para fazer upload ou arraste o arquivo aqui (PDF, PNG, JPG)</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 14v4a2 2 0 002 2h12a2 2 0 002-2v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <input type="file" id="proof" accept="application/pdf,image/png,image/jpeg" aria-describedby="file-error">
            </div>
            <span class="error" id="file-error" role="alert"></span>
          </div>

          <div class="field civil-field">
            <select id="maritalStatus" name="maritalStatus" required>
              <option value="" disabled selected hidden>Selecione o estado civil...</option>
              <option value="Solteiro">Solteiro</option>
              <option value="Casado">Casado</option>
              <option value="Divorciado">Divorciado</option>
              <option value="Viúvo">Viúvo</option>
            </select>
          </div>

          <!-- Seção de Cônjuge (Oculta por padrão) -->
          <div id="spouse-section" class="spouse-group hidden">
            <hr class="section-divider">
            <h3 class="section-title">Informações do Cônjuge</h3>

            <div class="field">
              <input id="spouseName" name="spouseName" placeholder="Nome Completo do Cônjuge">
            </div>

            <div class="field">
              <input id="spouseDocument" name="spouseDocument" placeholder="CPF do Cônjuge" inputmode="numeric" maxlength="14" aria-describedby="spouse-doc-error">
              <span class="error" id="spouse-doc-error"></span>
            </div>

            <div class="cep-row">
              <div class="field date-field">
                <span class="calendar-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </span>
                <input type="text" id="spouseBirthDate" name="spouseBirthDate" placeholder="Data de Nascimento (Opcional)" onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'">
              </div>

              <div class="field date-field">
                <span class="calendar-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </span>
                <input type="text" id="weddingDate" name="weddingDate" placeholder="Data do Casamento" onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'">
              </div>
            </div>

            <div class="field">
              <select id="propertyRegime" name="propertyRegime">
                <option value="" disabled selected hidden>Regime de bens...</option>
                <option value="Comunhão Parcial">Comunhão Parcial de Bens</option>
                <option value="Comunhão Universal">Comunhão Universal de Bens</option>
                <option value="Separação Total">Separação Total de Bens</option>
                <option value="Participação Final nos Aquestos">Participação Final nos Aquestos</option>
              </select>
            </div>

            <div class="field">
              <select id="activeMarriage" name="activeMarriage">
                <option value="" disabled selected hidden>Casamento ativo?</option>
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
              </select>
            </div>

            <div class="field">
              <div class="upload" id="spouse-drop-zone">
                <span id="spouse-file-name">Comprovante de União, clique para fazer upload ou arraste o arquivo aqui (PDF, PNG, JPG)</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 14v4a2 2 0 002 2h12a2 2 0 002-2v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <input type="file" id="unionProof" accept="application/pdf,image/png,image/jpeg" aria-describedby="spouse-file-error">
              </div>
              <span class="error" id="spouse-file-error" role="alert"></span>
            </div>
          </div>
        </div>

        <!-- Área de Salvar (Fixa no canto inferior direito) -->
        <div class="save-area">
          <p id="save-status" role="status" aria-live="polite"></p>
          <button class="save-button" type="submit">Salvar Cadastro</button>
        </div>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
