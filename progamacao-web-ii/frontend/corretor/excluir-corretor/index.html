<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1c1b">
  <title>Excluir Corretor | S.C.A.C.I.</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../../shared/styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="brand" aria-label="S.C.A.C.I."><span>S.C.A.</span><span>C.I.</span></header>
  <aside class="sidebar" aria-label="Menu principal">
    <p class="menu-title">Menu</p>
    <nav>
      <button type="button" data-section="Início">Início</button>
      <button type="button" data-section="Clientes">Clientes</button>
      <button type="button" data-section="Compradores">Compradores</button>
      <button type="button" data-section="Imóveis">Imóveis</button>
      <button type="button" data-section="Vendas">Vendas</button>
      <button type="button" data-section="Agenda de Visita">Agenda de Visita</button>
      <button type="button" data-section="Funcionários">Funcionários</button>
      <button type="button" aria-current="page" data-section="Corretores">Corretores</button>
    </nav>
  </aside>
  <main id="conteudo" tabindex="-1">
    <nav class="breadcrumb" aria-label="Localização">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></svg>
      <ol><li>Início</li><li>Corretores</li><li aria-current="page">Excluir</li></ol>
    </nav>
    <section class="content" aria-labelledby="page-title">
      <h1 id="page-title">Excluir <span>Corretor</span></h1>

      <div class="form-body">
        <!-- Coluna esquerda: dados pessoais, contato e parte do endereço -->
        <div class="coluna-esquerda">
          <div class="field">
            <label for="name">Nome Completo</label>
            <input id="name" type="text" readonly>
          </div>

          <div class="field">
            <label for="document">CPF ou CNPJ</label>
            <input id="document" type="text" readonly>
          </div>

          <div class="field">
            <label for="creci">CRECI</label>
            <input id="creci" type="text" readonly>
          </div>

          <div class="field date-field">
            <label for="birthDate">Data de Nascimento</label>
            <span class="calendar-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </span>
            <input id="birthDate" type="text" readonly>
          </div>

          <div class="field">
            <label for="phone">Telefone</label>
            <input id="phone" type="text" readonly>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="text" readonly>
          </div>

          <div class="cep-row">
            <div class="field">
              <label for="postalCode">CEP</label>
              <input id="postalCode" type="text" readonly>
            </div>
            <div class="field">
              <label for="complement">Complemento</label>
              <input id="complement" type="text" readonly>
            </div>
          </div>

          <div class="field">
            <label for="street">Logradouro</label>
            <input id="street" type="text" readonly>
          </div>

          <div class="address-row">
            <div class="field">
              <label for="number">Nº</label>
              <input id="number" type="text" readonly>
            </div>
            <div class="field">
              <label for="neighborhood">Bairro</label>
              <input id="neighborhood" type="text" readonly>
            </div>
          </div>
        </div>

        <!-- Coluna direita: restante do endereço e tipo do corretor -->
        <div class="coluna-direita">
          <div class="field">
            <label for="city">Cidade</label>
            <input id="city" type="text" readonly>
          </div>

          <div class="uf-row">
            <div class="field">
              <label for="state">UF</label>
              <input id="state" type="text" readonly>
            </div>
            <div class="field">
              <label for="type">Tipo Corretor</label>
              <input id="type" class="readonly-select" type="text" readonly>
            </div>
          </div>
        </div>
      </div>

      <div class="save-area">
        <button id="btn-excluir" class="delete-button" type="button">Excluir Corretor</button>
      </div>
    </section>
  </main>

  <dialog id="modal-exclusao" aria-labelledby="modal-title" aria-describedby="modal-text">
    <span class="modal-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </span>
    <h2 id="modal-title">Tem certeza que deseja excluir este corretor?</h2>
    <p id="modal-text">Esta ação não poderá ser desfeita.</p>
    <div class="modal-actions">
      <button id="btn-nao" class="btn-nao" type="button">Não</button>
      <button id="btn-confirmar" class="btn-confirmar" type="button">Sim, excluir</button>
    </div>
  </dialog>

  <dialog id="modal-sucesso" aria-labelledby="sucesso-title" aria-describedby="sucesso-text">
    <span class="modal-icon sucesso" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12.5 2.5 2.5L16 9.5"/></svg>
    </span>
    <h2 id="sucesso-title">Corretor excluído com sucesso!</h2>
    <p id="sucesso-text">O corretor foi removido do sistema.</p>
    <div class="modal-actions">
      <button id="btn-ok" class="btn-ok" type="button">Fechar</button>
    </div>
  </dialog>

  <dialog id="navigation-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">Módulo em desenvolvimento</h2><p id="navigation-message"></p><form method="dialog"><button class="btn-nao">Voltar</button></form></dialog>
</body>
</html>
