<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1c1b" />
    <title>Pesquisar Corretor | S.C.A.C.I.</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="brand" aria-label="S.C.A.C.I.">
      <span>S.C.A.</span><span>C.I.</span>
    </header>

    <aside class="sidebar" aria-label="Menu principal">
      <p class="menu-title">Menu</p>
      <nav>
        <button type="button" data-section="Início">Início</button>
        <button type="button" data-section="Clientes">Clientes</button>
        <button type="button" data-section="Compradores">Compradores</button>
        <button type="button" data-section="Imóveis">Imóveis</button>
        <button type="button" data-section="Vendas">Vendas</button>
        <button type="button" data-section="Agenda de Visita">Agenda de Visita</button>
        <button type="button" data-section="Funcionários">Funcionários</button>
        <button type="button" data-section="Corretores" aria-current="page">Corretores</button>
      </nav>
    </aside>

    <main id="conteudo" tabindex="-1">
      <nav class="breadcrumb" aria-label="Localização">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9.5Z"/>
        </svg>
        <span class="chevron" aria-hidden="true">‹</span>
        <ol>
          <li>Início</li>
          <li>Corretores</li>
          <li aria-current="page">Pesquisar</li>
        </ol>
      </nav>

      <section class="content" aria-labelledby="page-title">
        <h1 id="page-title">Pesquisar <span>Corretor</span></h1>

        <form id="search-form" class="search-panel" novalidate>
          <div class="filter-header">
            <h2>Filtros de Pesquisa</h2>
            <div class="filter-actions">
              <button type="submit" class="primary-button">Aplicar</button>
              <button type="button" class="secondary-button" id="clear-filter">Limpar Filtro</button>
            </div>
          </div>

          <p class="search-feedback" id="search-feedback" aria-live="polite"></p>

          <div class="filter-grid">
            <label class="field">
              <span>Pesquisar por Nome, CPF ou CRECI</span>
              <input id="searchInput" name="searchInput" type="search" placeholder="Digite nome, CPF ou CRECI" />
            </label>

            <label class="field">
              <span>Cidade</span>
              <input id="city" name="city" type="text" placeholder="Vitoria da Conquista" />
            </label>

            <label class="field">
              <span>UF</span>
              <select id="uf" name="uf">
                <option value="">Selecione</option>
                <option value="BA">BA</option>
                <option value="SP">SP</option>
                <option value="MG">MG</option>
                <option value="RJ">RJ</option>
                <option value="PR">PR</option>
                <option value="GO">GO</option>
                <option value="SC">SC</option>
                <option value="RS">RS</option>
              </select>
            </label>
          </div>
        </form>

        <section class="results" aria-labelledby="results-title">
          <div class="results-header">
            <h2 id="results-title">Resultados da Pesquisa</h2>
            <p id="results-summary">Exibindo 5 de 32 Corretores</p>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>CPF</th>
                  <th>CRECI</th>
                  <th scope="col"><span class="sr-only">Ações</span></th>
                </tr>
              </thead>
              <tbody id="results-body"></tbody>
            </table>
          </div>

          <div class="pagination" aria-label="Paginação">
            <button type="button" class="page-button is-disabled" aria-label="Página anterior">‹</button>
            <button type="button" class="page-button is-active">1</button>
            <button type="button" class="page-button">2</button>
            <button type="button" class="page-button">3</button>
            <button type="button" class="page-button" aria-label="Próxima página">›</button>
          </div>
        </section>
      </section>
    </main>
    <dialog id="navigation-dialog">
      <h2>Módulo em desenvolvimento</h2>
      <p id="navigation-message"></p>

      <form method="dialog">
        <button type="submit" class="primary-button">Voltar</button>
      </form>
    </dialog>
  </body>
</html>
