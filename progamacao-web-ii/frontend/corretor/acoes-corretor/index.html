<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1c1b">
  <title>Ações do corretor | S.C.A.C.I.</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../../shared/styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <header class="brand">S.C.A.<span>C.I.</span></header>
  <aside class="sidebar" aria-label="Menu principal">
    <p class="menu-title">Menu</p>
    <nav>
      <button type="button" data-section="Início">Início</button>
      <button type="button" data-section="Clientes">Clientes</button>
      <button type="button" data-section="Compradores">Compradores</button>
      <button type="button" data-section="Imóveis">Imóveis</button>
      <button type="button" data-section="Vendas">Vendas</button>
      <button type="button" data-section="Agenda de Visita">Agenda de Visita</button>
      <button type="button" data-section="Funcionários">Funcionários</button>
      <button type="button" data-section="Corretores" aria-current="page">Corretores</button>
    </nav>
    <p class="sidebar-footer">Seu negócio,<br>mais organizado.</p>
  </aside>
  <main id="conteudo" tabindex="-1">
    <nav class="breadcrumb" aria-label="Localização"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></svg><ol><li>Início</li><li>Corretores</li><li aria-current="page">Ações</li></ol></nav>
    <section class="content" aria-labelledby="page-title">
      <h1 id="page-title">Ações do <span>corretor</span></h1>
      <p class="muted">Selecione a ação que deseja realizar.</p>
      <nav class="broker-actions" aria-label="Ações do corretor">
        <button id="new-broker" type="button" class="action-card" data-action="cadastrar">
          <span class="action-icon" aria-hidden="true">＋</span>
          <span>Cadastrar corretor</span>
        </button>
        <button id="edit-broker" type="button" class="action-card" data-action="editar">
          <span class="action-icon" aria-hidden="true">✎</span>
          <span>Editar corretor</span>
        </button>
        <button id="search-broker" type="button" class="action-card" data-action="pesquisa">
          <svg class="action-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg>
          <span>Pesquisar corretor</span>
        </button>
        <button id="delete-broker" type="button" class="action-card" data-action="excluir">
          <svg class="action-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>
          <span>Excluir corretor</span>
        </button>
      </nav>
    </section>
  </main>
  <dialog id="navigation-dialog" aria-labelledby="navigation-title"><h2 id="navigation-title">Módulo em desenvolvimento</h2><p id="navigation-message"></p><div class="dialog-actions"><button type="button" data-close>Voltar</button></div></dialog>
</body>
</html>
