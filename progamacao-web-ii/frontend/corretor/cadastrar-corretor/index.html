<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1c1b">
  <title>Cadastrar Corretor | S.C.A.C.I.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="brand" aria-label="S.C.A.C.I."><span>S.C.A.</span><span>C.I.</span></header>

  <aside class="sidebar">
    <div class="menu-title">Menu</div>
    <nav>
      <button type="button" data-section="Início">Início</button>
      <button type="button" data-section="Clientes">Clientes</button>
      <button type="button" data-section="Compradores">Compradores</button>
      <button type="button" data-section="Imóveis">Imóveis</button>
      <button type="button" data-section="Vendas">Vendas</button>
      <button type="button" data-section="Agenda de Visita">Agenda de Visita</button>
      <button type="button" data-section="Funcionários">Funcionários</button>
      <button type="button" data-section="Corretores" class="active">Corretores</button>
    </nav>
  </aside>

  <main>
    <div class="breadcrumb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <ol>
        <li>Início</li>
        <li>Cadastrar Corretor</li>
      </ol>
    </div>

    <div class="content">
      <h1>Cadastrar <span>Corretor</span></h1>

      <form id="broker-form" novalidate>
        <div class="form-body">
          <div class="field">
            <input id="name" name="name" placeholder="Nome Completo" autocomplete="name" required maxlength="100">
          </div>

          <div class="field">
            <input id="document" name="document" placeholder="CPF ou CNPJ" inputmode="numeric" required maxlength="18" aria-describedby="document-error">
            <span class="error" id="document-error"></span>
          </div>

          <div class="field">
            <input id="creci" name="creci" placeholder="CRECI (ex: 12345-F)" required maxlength="20">
          </div>

          <div class="field date-field">
            <span class="calendar-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </span>
            <input type="text" id="birthDate" name="birthDate" placeholder="Data de Nascimento (DD/MM/AAAA)" onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'">
          </div>

          <div class="field">
            <input type="tel" id="phone" name="phone" placeholder="Telefone" autocomplete="tel-national" required maxlength="16">
          </div>

          <div class="field">
            <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required maxlength="100">
          </div>

          <div class="field broker-type-field">
            <select id="brokerType" name="brokerType" required>
              <option value="" disabled selected hidden>Tipo de Corretor...</option>
              <option value="interno">Interno</option>
              <option value="externo">Externo</option>
            </select>
          </div>
          
          <div class="cep-row">
            <div class="field">
              <input id="postalCode" name="postalCode" placeholder="CEP" autocomplete="postal-code" inputmode="numeric" maxlength="9" aria-describedby="postal-error">
              <span class="error" id="postal-error"></span>
            </div>
            <div class="field">
              <input id="complement" name="complement" placeholder="Complemento" maxlength="100">
            </div>
          </div>
          
          <div class="field">
            <input id="street" name="street" placeholder="Logradouro" autocomplete="address-line1" maxlength="100">
          </div>
          
          <div class="address-row">
            <div class="field">
              <input id="number" name="number" placeholder="Nº" maxlength="10">
            </div>
            <div class="field">
              <input id="neighborhood" name="neighborhood" placeholder="Bairro" maxlength="100">
            </div>
          </div>
          
          <div class="city-row">
            <div class="field">
              <input id="city" name="city" placeholder="Cidade" autocomplete="address-level2" maxlength="100">
            </div>
            <div class="field">
              <select id="state" name="state" autocomplete="address-level1" aria-label="UF">
                <option value="" disabled selected hidden>UF</option>
              </select>
            </div>
          </div>
        </div>

        <div class="save-area">
          <p id="save-status" role="status" aria-live="polite"></p>
          <button class="save-button" type="submit">Salvar Cadastro</button>
        </div>
      </form>
    </div>
  </main>

  <dialog id="navigation-dialog">
    <p id="navigation-message"></p>
    <form method="dialog">
      <button>OK</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
